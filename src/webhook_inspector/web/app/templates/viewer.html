<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hooktrace — {{ token }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-700 px-6 py-4 flex items-start justify-between gap-4">
    <div>
      <h1 class="text-xl font-mono">hooktrace</h1>
      <p class="text-sm text-slate-400 mt-1">
        Ingestion URL:
        <code class="bg-slate-800 px-2 py-1 rounded">{{ hook_url }}</code>
      </p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <a class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-sm font-mono px-3 py-2 rounded"
         href="/{{ token }}/integrations">
        Integrations
      </a>
      <a class="export-button bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-mono px-3 py-2 rounded"
         href="/api/endpoints/{{ token }}/export.json"
         download>
        Export JSON
      </a>
    </div>
  </header>

  <details class="px-6 py-2 bg-slate-800 border-b border-slate-700 text-sm font-mono">
    <summary class="cursor-pointer text-slate-400 hover:text-slate-200 select-none">
      &#9881; Configure HMAC signature verification
    </summary>
    <form id="config-form" class="mt-3 flex items-center gap-2 flex-wrap">
      <select name="provider"
              class="bg-slate-900 border border-slate-700 text-slate-100 rounded px-2 py-1 text-xs focus:outline-none focus:border-emerald-400">
        <option value="">&mdash; none &mdash;</option>
        <option value="stripe">stripe</option>
        <option value="github">github</option>
        <option value="shopify">shopify</option>
        <option value="twilio">twilio</option>
        <option value="mailgun">mailgun</option>
        <option value="discord">discord</option>
        <option value="slack">slack</option>
        <option value="zapier">zapier</option>
        <option value="n8n">n8n</option>
      </select>
      <input type="password"
             name="secret"
             placeholder="signing secret (or Discord public key)"
             autocomplete="off"
             class="flex-1 min-w-48 bg-slate-900 border border-slate-700 text-slate-100 rounded px-2 py-1 text-xs placeholder-slate-500 focus:outline-none focus:border-emerald-400">
      <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded">
        Save
      </button>
      <span id="config-status" class="text-xs"></span>
    </form>
  </details>

  <main class="px-6 py-4">
    <form class="mb-3"
          hx-get="/api/endpoints/{{ token }}/requests.fragment"
          hx-target="#requests"
          hx-trigger="keyup changed delay:300ms from:input[name='q'], search from:input[name='q']"
          hx-swap="innerHTML"
          onsubmit="event.preventDefault()">
      <input type="search"
             name="q"
             placeholder="Search captured requests..."
             aria-label="Search captured requests"
             maxlength="200"
             class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-3 py-2 text-sm font-mono placeholder-slate-500 focus:outline-none focus:border-emerald-400">
    </form>
    <div hx-ext="sse" sse-connect="/stream/{{ token }}" class="space-y-2">
      <ul id="requests" sse-swap="message" hx-swap="afterbegin" class="space-y-2">
        {% for req in initial_requests %}
          {% include "request_fragment.html" %}
        {% endfor %}
      </ul>
    </div>
  </main>

  <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-slate-100 px-3 py-2 rounded shadow-lg opacity-0 transition-opacity pointer-events-none">
    Copied to clipboard
  </div>

  <script>
    function showToast(message, isError) {
      const t = document.getElementById("toast");
      t.textContent = message || "Copied to clipboard";
      t.className =
        "fixed bottom-4 right-4 px-3 py-2 rounded shadow-lg opacity-100 transition-opacity " +
        (isError
          ? "bg-rose-900 text-rose-100"
          : "bg-slate-800 text-slate-100");
      setTimeout(() => { t.style.opacity = "0"; }, 3000);
    }

    function buildCurl(li) {
      const method = li.dataset.method;
      const url = li.dataset.url;
      const headers = JSON.parse(li.dataset.headers || "{}");
      const body = JSON.parse(li.dataset.body);
      const bodySize = parseInt(li.dataset.bodySize, 10);

      const lines = [`curl -X ${method} '${url.replace(/'/g, "'\\''")}'`];
      for (const [k, v] of Object.entries(headers)) {
        // Skip headers curl will set automatically
        if (["host", "content-length"].includes(k.toLowerCase())) continue;
        lines.push(`  -H '${k}: ${String(v).replace(/'/g, "'\\''")}'`);
      }
      if (body !== null && body !== "") {
        lines.push(`  -d '${body.replace(/'/g, "'\\''")}'`);
      } else if (bodySize > 8192) {
        lines.push(`  # body too large, not inline (size: ${bodySize} bytes)`);
      }
      return lines.join(" \\\n");
    }

    document.getElementById("requests").addEventListener("click", async (e) => {
      const copyBtn = e.target.closest(".copy-curl-btn");
      if (copyBtn) {
        const li = copyBtn.closest("li");
        if (!li) return;
        const cmd = buildCurl(li);
        try {
          await navigator.clipboard.writeText(cmd);
          showToast("Copied to clipboard");
        } catch {
          const ta = document.createElement("textarea");
          ta.value = cmd;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast("Copied to clipboard");
        }
        return;
      }

      const replayBtn = e.target.closest(".replay-btn");
      if (replayBtn) {
        const li = replayBtn.closest("li");
        if (!li) return;
        const requestId = li.dataset.requestId;
        const target = prompt("Replay this request to URL:", "https://");
        if (!target) return;
        const originalText = replayBtn.textContent;
        replayBtn.disabled = true;
        replayBtn.textContent = "...";
        try {
          const resp = await fetch(
            `/api/endpoints/{{ token }}/requests/${requestId}/replay`,
            {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({target_url: target}),
            },
          );
          const data = await resp.json();
          if (data.error) {
            showToast(`Replay blocked: ${data.error}`, true);
          } else if (data.status_code) {
            const ok = data.status_code >= 200 && data.status_code < 300;
            showToast(
              `Replay → ${data.status_code} (${data.duration_ms}ms)`,
              !ok,
            );
          } else {
            showToast(`Replay failed: ${resp.status}`, true);
          }
        } catch (err) {
          showToast(`Replay error: ${err.message}`, true);
        } finally {
          replayBtn.disabled = false;
          replayBtn.textContent = originalText;
        }
      }
    });

    document.getElementById("config-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const provider = fd.get("provider");
      const secret = fd.get("secret");
      const status = document.getElementById("config-status");
      status.textContent = "saving...";
      status.className = "text-xs text-slate-400";
      try {
        const body = provider
          ? {signature: {provider: provider, secret: secret}}
          : {};
        const resp = await fetch("/api/endpoints/{{ token }}/config", {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
        });
        if (resp.ok) {
          status.textContent = "✓ saved";
          status.className = "text-xs text-emerald-400";
          e.target.reset();
          setTimeout(() => { status.textContent = ""; }, 3000);
        } else {
          // Surface Pydantic's validation messages so the user can fix the
          // input — e.g. "secret must be non-empty". Fall back to the status
          // code if the body isn't JSON.
          let detail = `${resp.status}`;
          try {
            const json = await resp.json();
            if (typeof json.detail === "string") {
              detail = json.detail;
            } else if (Array.isArray(json.detail)) {
              detail = json.detail.map((d) => d.msg || JSON.stringify(d)).join("; ");
            }
          } catch {
            // ignore — fallback to status code already set
          }
          status.textContent = `✗ ${detail}`;
          status.className = "text-xs text-rose-400";
        }
      } catch (err) {
        status.textContent = `✗ ${err.message}`;
        status.className = "text-xs text-rose-400";
      }
    });
  </script>
</body>
</html>
