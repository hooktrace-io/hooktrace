app            = "webhook-inspector-ingestor"
primary_region = "cdg"

[build]
  dockerfile = "../../Dockerfile"

[deploy]
  # Pas de release_command : seul le service web pilote les migrations.
  strategy = "rolling"

[processes]
  app = "uvicorn webhook_inspector.web.ingestor.main:app --host 0.0.0.0 --port 8080"

[env]
  PORT                 = "8080"
  ENVIRONMENT          = "prod"
  LOG_LEVEL            = "INFO"
  SERVICE_NAME         = "webhook-inspector"
  BLOB_STORAGE_BACKEND = "s3"
  S3_REGION            = "auto"
  # V3 self-contained observability — every span recorded in the in-memory
  # buffer + ConsoleSpanExporter. The previous parentbased_traceidratio at
  # 0.05 was overriding our code-level ALWAYS_ON sampler for FastAPI
  # auto-instrumented root spans, leaving trace_summary null on ~95% of
  # captures. Belt-and-braces : set the env var explicitly to always_on so
  # any code path that reads it (auto-instrumentors, SDK auto-config) gets
  # the same answer as our TracerProvider(sampler=ALWAYS_ON).
  OTEL_TRACES_SAMPLER  = "always_on"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
