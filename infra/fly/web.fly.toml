app            = "webhook-inspector-web"
primary_region = "cdg"

# Required Fly secrets (NOT in this file — set via `fly secrets set`):
#   - DATABASE_URL                  Postgres async DSN (postgres+psycopg://...)
#   - SECRETS_ENCRYPTION_KEY        32 bytes base64; AES-256 for HMAC + forward secrets
#   - REDIS_URL                     Upstash rediss:// URL — arq forward queue
#   - RATE_LIMIT_REDIS_URL          Same Upstash instance, separate logical use — rate-limit middleware
#   - S3_ENDPOINT_URL               Cloudflare R2 account-scoped endpoint
#   - S3_BUCKET_NAME                R2 bucket name
#   - S3_ACCESS_KEY_ID              R2 access key
#   - S3_SECRET_ACCESS_KEY          R2 secret access key
# Lifespan asserts REDIS_URL + RATE_LIMIT_REDIS_URL are set when ENVIRONMENT="prod"
# and refuses to serve traffic otherwise (no silent degradation).

[build]
  dockerfile = "../../Dockerfile"

[deploy]
  # Tourne avant la promotion : remplace le Cloud Run Job `migrator`.
  release_command = "alembic upgrade head"
  strategy        = "rolling"

[processes]
  app = "uvicorn webhook_inspector.web.app.main:app --host 0.0.0.0 --port 8080"

[env]
  PORT                 = "8080"
  ENVIRONMENT          = "prod"
  LOG_LEVEL            = "INFO"
  SERVICE_NAME         = "webhook-inspector"
  BLOB_STORAGE_BACKEND = "s3"
  S3_REGION            = "auto"
  # V3 self-contained observability — every span recorded in the in-memory
  # buffer + ConsoleSpanExporter. The previous parentbased_traceidratio at
  # 0.1 / 0.05 was overriding our code-level ALWAYS_ON sampler for FastAPI
  # auto-instrumented root spans, leaving trace_summary null on ~95% of
  # captures. Belt-and-braces : set the env var explicitly to always_on so
  # any code path that reads it (auto-instrumentors, SDK auto-config) gets
  # the same answer as our TracerProvider(sampler=ALWAYS_ON).
  OTEL_TRACES_SAMPLER  = "always_on"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
