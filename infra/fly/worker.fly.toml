app            = "webhook-inspector-worker"
primary_region = "cdg"

# Required Fly secrets (NOT in this file — set via `fly secrets set`):
#   - DATABASE_URL                  Postgres async DSN (postgres+psycopg://...)
#   - SECRETS_ENCRYPTION_KEY        32 bytes base64; AES-256 for HMAC + forward secrets
#   - REDIS_URL                     Upstash rediss:// URL — arq forward queue (drained here)
#   - S3_ENDPOINT_URL               Cloudflare R2 account-scoped endpoint
#   - S3_BUCKET_NAME                R2 bucket name
#   - S3_ACCESS_KEY_ID              R2 access key
#   - S3_SECRET_ACCESS_KEY          R2 secret access key
#   - ABUSE_WEBHOOK_URL             (optional) Discord webhook for phishing-scan alerts
# WorkerSettings.on_startup asserts REDIS_URL is set when ENVIRONMENT="prod"
# and raises so the worker doesn't silently drain an empty localhost queue.
# RATE_LIMIT_REDIS_URL is NOT required: the worker doesn't read it.

[build]
  # Same Dockerfile as web/ingestor. uv installs arq into /app/.venv/bin/ and
  # the runtime stage sets PATH so `arq` resolves.
  dockerfile = "../../Dockerfile"

[deploy]
  strategy = "rolling"
  # No release_command: the worker is stateless w.r.t. migrations — web's
  # release_command = "alembic upgrade head" already runs on every push.

[processes]
  worker = "arq webhook_inspector.jobs.worker.WorkerSettings"

[env]
  ENVIRONMENT          = "prod"
  LOG_LEVEL            = "INFO"
  SERVICE_NAME         = "webhook-inspector"
  # Match web/ingestor: the worker reads R2-offloaded webhook bodies during
  # schema inference and forwarding. Without these, make_blob_storage falls
  # back to LocalBlobStorage → silent FileNotFoundError at job time.
  BLOB_STORAGE_BACKEND = "s3"
  S3_REGION            = "auto"
  # No PORT — worker has no http_service block. Fly knows not to wire a
  # public listener.

# No http_service: the worker is fire-and-forget for V3. Health = "did the
# process exit?" via Fly's process supervisor. Liveness signal for V3 is
# the Redis queue depth metric (PR10 will add alerting on backlog > N).
# V4 may add an HTTP /health endpoint inside the worker process if richer
# liveness is needed.

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
