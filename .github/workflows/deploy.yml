name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy web (runs Alembic migrations via release_command)
        run: flyctl deploy --remote-only --config infra/fly/web.fly.toml

      - name: Deploy ingestor
        run: flyctl deploy --remote-only --config infra/fly/ingestor.fly.toml

      - name: Deploy worker (arq job runner + abuse_scan cron)
        run: flyctl deploy --remote-only --config infra/fly/worker.fly.toml

      - name: Wait for new revision healthy
        run: |
          set -e
          # Hit Fly directly, not the Cloudflare-fronted hooktrace.io: Bot
          # Fight Mode 403s the GitHub runner IPs. The smoke test verifies
          # "the Fly deploy itself works"; CDN/WAF correctness is verified
          # out-of-band on first setup and doesn't change per-deploy.
          APP_URL="https://webhook-inspector-web.fly.dev"
          INGESTOR_URL="https://webhook-inspector-ingestor.fly.dev"

          # With auto_stop_machines=stop + min_machines_running=0, flyctl
          # deploy updates the image but doesn't actually start a machine if
          # none was running. The first request wakes one. We trigger the
          # wake here, then poll Fly's internal state (faster + more accurate
          # than re-probing through HTTP while the new machine is still
          # cold-pulling the image).
          curl -m 60 -s -o /dev/null "$APP_URL/health" &
          curl -m 60 -s -o /dev/null "$INGESTOR_URL/health" &
          wait

          poll_healthy() {
            local name=$1
            local deadline=$((SECONDS + 240))
            until flyctl status -a "$name" --json | jq -e '
              .Machines
              | map(select(.state == "started"
                           and ((.checks // []) | length > 0)
                           and all(.checks[]; .status == "passing")))
              | length > 0
            ' >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$name: not healthy after 4 min"
                flyctl status -a "$name"
                exit 1
              fi
              echo "$name: waiting for started + passing checks..."
              sleep 10
            done
            echo "$name: healthy"
          }

          poll_healthy webhook-inspector-web
          poll_healthy webhook-inspector-ingestor

      - name: Smoke test
        run: |
          set -e
          # See "Wait for new revision healthy" for the rationale on
          # bypassing Cloudflare in CI.
          APP_URL="https://webhook-inspector-web.fly.dev"
          INGESTOR_URL="https://webhook-inspector-ingestor.fly.dev"

          TOKEN=$(curl -sX POST ${APP_URL}/api/endpoints | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          if [ -z "$TOKEN" ]; then
            echo "endpoint creation failed (empty token)"
            exit 1
          fi

          STATUS=$(curl -sX POST ${INGESTOR_URL}/h/${TOKEN} -d 'ci-deploy-smoke' -o /dev/null -w '%{http_code}')
          test "$STATUS" = "200" || { echo "smoke test failed with status $STATUS"; exit 1; }

          echo "Deploy successful."
