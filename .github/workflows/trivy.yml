name: trivy

# Scan the prod Docker image for OS + Python library CVEs. On PRs we only
# trigger when something that affects the image changes (Dockerfile, deps,
# the workflow itself). On main we run unconditionally. Weekly schedule
# catches new CVEs against already-deployed images.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/trivy.yml"
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC — before the working week starts

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build prod image
        run: docker build -t hooktrace-scan:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hooktrace-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Gate merges on HIGH/CRITICAL with a fix available. The Dockerfile
          # runs apt-get upgrade in both stages, so Debian security patches
          # are pulled at build time. If a new CVE appears with a fix Debian
          # has shipped, this build will catch it; if the fix isn't packaged
          # yet, ignore-unfixed lets it through silently (still in Security tab).
          exit-code: "1"
          ignore-unfixed: true
          cache: "true"
          # With format=sarif, the action defaults to ignoring the severity
          # filter ("SARIF should be complete for GitHub Security tab"),
          # which means exit-code=1 triggers on LOW/MEDIUM findings too and
          # defeats the gate. This re-applies the filter to BOTH the exit
          # code and the SARIF upload — we accept losing LOW/MEDIUM in the
          # Security tab in exchange for an exit code that actually matches
          # the documented gating policy. LOW/MEDIUM on transitive deps are
          # rarely actionable for a side project; the weekly cron + the
          # GitHub-native Dependabot alerts cover that ground.
          limit-severities-for-sarif: "true"

      - name: Summarize findings in the log
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            COUNT=$(jq '.runs[0].results | length' trivy-results.sarif)
            echo "::notice::Trivy reported $COUNT HIGH/CRITICAL findings with fix available."
            jq -r '.runs[0].results[] | "  \(.ruleId)  \(.message.text)"' trivy-results.sarif | head -30 || true
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
