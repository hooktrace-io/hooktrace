name: codeql

# Run on PR + push so security regressions land in the Security tab before
# merge. Weekly schedule catches new queries shipped by GitHub against
# already-merged code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"  # Monday noon UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-and-quality includes the default security suite plus
          # broader code-quality queries. False positives are reviewable in
          # the Security tab; we'd rather see noise than miss real findings
          # on a public webhook receiver.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
